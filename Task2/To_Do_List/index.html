<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container">

        <section class="todo-box">

            <div class="heading">

                <p class="subtitle">STAY ORGANIZED</p>

                <h1>My To-Do List</h1>

                <p>
                    Add your tasks, mark them as complete,
                    and remove them when you're done.
                </p>

            </div>


            <!-- Task input -->

            <div class="task-input">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                >

                <button id="addTaskBtn">
                    Add Task
                </button>

            </div>


            <!-- Task list -->

            <ul id="taskList"></ul>


            <!-- Empty message -->

            <p id="emptyMessage">
                No tasks yet. Add your first task!
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
